name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # One group per PR, so a new push cancels the older run. Pushes to main get a
  # group per run, so they are never cancelled.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: bunx biome ci .

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: bun run typecheck
      # The component gallery is the visual proof sheet for @vanr/ui; it must keep building.
      - run: bun run --cwd packages/ui gallery:build

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The shard count is the length of this list.
        # Six keep each one well under ~70 s with the CI times in scripts/ci/test-timings.json.
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: bun test --shard="$SHARD/$SHARDS" --timings=scripts/ci/test-timings.json
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ strategy.job-total }}

  web:
    # The web app: its tests run with a DOM, from its own folder (bunfig.toml there), and the
    # production build must keep working. The root test job leaves apps/web out.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: bun test
        working-directory: apps/web
      - run: bun run build
        working-directory: apps/web

  postgres:
    # The migration against a real Postgres (with pgvector, as in production); PGlite covers the rest.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg18@sha256:2ba9ca5f2e7daa0f0e7723cba1ee9167bab54efd3640516a44ac1a928dd67e7a
        env:
          POSTGRES_DB: vanr_test
          # A throwaway database that only this job can reach.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vanr_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: bun test packages/engine/src/db/catalog.test.ts packages/engine/src/sqlconn.test.ts --test-name-pattern Postgres
        env:
          VANR_TEST_POSTGRES_URL: postgres://postgres@localhost:5432/vanr_test
      # Search with the vector leg (pgvector), each index in a database of its own.
      - run: bun test packages/engine/src/search-pg.test.ts --test-name-pattern "real Postgres"
        env:
          VANR_TEST_POSTGRES_URL: postgres://postgres@localhost:5432/vanr_test
      # The server as a single instance (the advisory lock, the undo of a boot that fails after it) and
      # the usage ledger on Postgres, each test in a database of its own.
      - run: bun test apps/server/test/production.test.ts apps/server/test/usage-ledger.test.ts
        env:
          VANR_TEST_POSTGRES_URL: postgres://postgres@localhost:5432/vanr_test
      # One pending invitation per email and every notice counted, with requests on several connections at once.
      - run: bun test apps/server/test/concurrency-postgres.test.ts
        env:
          VANR_TEST_POSTGRES_URL: postgres://postgres@localhost:5432/vanr_test
      # The same forced tests with the locks left out by the test's own double: both must fail on the outcome
      # the lock is for (LOCK_OUTCOME_MISMATCH), or they would pass without the locks too and prove nothing.
      # A failure for any other reason (the wait timed out, a connection closed, an error between tests)
      # proves nothing either, so this step fails then.
      - name: The forced lock tests fail without the locks
        run: |
          set +e
          bun test apps/server/test/concurrency-postgres.test.ts --test-name-pattern forced > forced.log 2>&1
          status=$?
          cat forced.log
          if [ "$status" -eq 0 ]; then
            echo "::error::the forced lock tests passed without the locks"
            exit 1
          fi
          for broken in LOCK_WAIT_TIMEOUT CONNECTION_CLOSED "Unhandled error" "timed out"; do
            if grep -qF "$broken" forced.log; then
              echo "::error::the forced lock tests broke ($broken) instead of failing on their outcome"
              exit 1
            fi
          done
          for label in invite notice; do
            if ! grep -qF "LOCK_OUTCOME_MISMATCH($label)" forced.log; then
              echo "::error::the forced $label test did not fail on its outcome without the lock"
              exit 1
            fi
          done
        env:
          VANR_TEST_POSTGRES_URL: postgres://postgres@localhost:5432/vanr_test
          VANR_TEST_DROP_LOCKS: "1"
      # One message per resend, every thread reply counted and one winner per thread state action, with
      # requests on several connections at once. Each guard is one statement (no lock to take out); the PGlite
      # run of threads.test.ts fails on the same race without the conditional UPDATE.
      - run: bun test apps/server/test/messages-postgres.test.ts
        env:
          VANR_TEST_POSTGRES_URL: postgres://postgres@localhost:5432/vanr_test
      # Each queued send goes out once and is canceled or sent, never both, with passes on several connections at
      # once. Each guard is one conditional UPDATE (no lock to take out).
      - run: bun test apps/server/test/outbox-postgres.test.ts
        env:
          VANR_TEST_POSTGRES_URL: postgres://postgres@localhost:5432/vanr_test
      # The forced claim test with the claim's condition left out by the test's own double: it must fail on the
      # outcome the condition is for (LOCK_OUTCOME_MISMATCH), only in tests named "forced", one per label; any other
      # failure (a timeout, a closed connection, an error between tests) proves nothing and fails this step.
      - name: The forced outbox claim test fails without the condition
        run: |
          set +e
          bun test apps/server/test/outbox-postgres.test.ts --test-name-pattern forced > forced-outbox.log 2>&1
          status=$?
          cat forced-outbox.log
          if [ "$status" -eq 0 ]; then
            echo "::error::the forced outbox claim test passed without the condition"
            exit 1
          fi
          for broken in LOCK_WAIT_TIMEOUT CONNECTION_CLOSED "Unhandled error" "timed out"; do
            if grep -aqF "$broken" forced-outbox.log; then
              echo "::error::the forced outbox claim test broke ($broken) instead of failing on its outcome"
              exit 1
            fi
          done
          if grep -a '^(fail)' forced-outbox.log | grep -avqF 'forced'; then
            echo "::error::a test that isn't a forced one failed"
            exit 1
          fi
          labels="outbox"
          failed=$(grep -a '^(fail)' forced-outbox.log | sort -u | wc -l)
          if [ "$failed" -ne "$(echo $labels | wc -w)" ]; then
            echo "::error::$failed forced tests failed, expected one per label ($labels)"
            exit 1
          fi
          for label in $labels; do
            if ! grep -aqF "LOCK_OUTCOME_MISMATCH($label)" forced-outbox.log; then
              echo "::error::the forced $label test did not fail on its outcome without the condition"
              exit 1
            fi
          done
        env:
          VANR_TEST_POSTGRES_URL: postgres://postgres@localhost:5432/vanr_test
          VANR_TEST_DROP_LOCKS: "1"
      # One runner per pairing code, one open browser intervention per agent and one answer per secret request.
      - run: bun test apps/server/test/runners-postgres.test.ts
        env:
          VANR_TEST_POSTGRES_URL: postgres://postgres@localhost:5432/vanr_test
      - name: The forced runner lock tests fail without the locks
        run: |
          set +e
          bun test apps/server/test/runners-postgres.test.ts --test-name-pattern forced > forced-runners.log 2>&1
          status=$?
          cat forced-runners.log
          if [ "$status" -eq 0 ]; then
            echo "::error::the forced runner lock tests passed without the locks"
            exit 1
          fi
          for broken in LOCK_WAIT_TIMEOUT CONNECTION_CLOSED "Unhandled error" "timed out"; do
            if grep -qF "$broken" forced-runners.log; then
              echo "::error::the forced runner lock tests broke ($broken) instead of failing on their outcome"
              exit 1
            fi
          done
          for label in job-done job-tail intervention-start sandbox browser-policy; do
            if ! grep -qF "LOCK_OUTCOME_MISMATCH($label)" forced-runners.log; then
              echo "::error::the forced $label test did not fail on its outcome without the lock"
              exit 1
            fi
          done
        env:
          VANR_TEST_POSTGRES_URL: postgres://postgres@localhost:5432/vanr_test
          VANR_TEST_DROP_LOCKS: "1"
      # Issue numbers one after another, each change of an issue compared with the one before, one consolidation applied once.
      - run: bun test apps/server/test/issues-postgres.test.ts
        env:
          VANR_TEST_POSTGRES_URL: postgres://postgres@localhost:5432/vanr_test
      - name: The forced issue lock tests fail without the locks
        run: |
          set +e
          bun test apps/server/test/issues-postgres.test.ts --test-name-pattern forced > forced-issues.log 2>&1
          status=$?
          cat forced-issues.log
          if [ "$status" -eq 0 ]; then
            echo "::error::the forced issue lock tests passed without the locks"
            exit 1
          fi
          for broken in LOCK_WAIT_TIMEOUT CONNECTION_CLOSED "Unhandled error" "timed out"; do
            if grep -aqF "$broken" forced-issues.log; then
              echo "::error::the forced issue lock tests broke ($broken) instead of failing on their outcome"
              exit 1
            fi
          done
          set -- issue-number issue-move issue-place consolidation-apply
          for label in "$@"; do
            if ! grep -aqF "LOCK_OUTCOME_MISMATCH($label)" forced-issues.log; then
              echo "::error::the forced $label test did not fail on its outcome without the lock"
              exit 1
            fi
          done
          # Every failure is a forced test, and as many distinct tests failed as there are labels (bun prints
          # each failure twice on the GitHub runner, so names are counted, not lines).
          failed=$(grep -a '^(fail) ' forced-issues.log | sed -E 's/^\(fail\) //; s/ \[[0-9.]+m?s\]$//' | sort -u)
          if printf '%s\n' "$failed" | grep -qv forced; then
            echo "::error::a test outside the forced ones failed without the locks: $failed"
            exit 1
          fi
          count=$(printf '%s\n' "$failed" | grep -c .)
          if [ "$count" -ne "$#" ]; then
            echo "::error::$count distinct forced tests failed without the locks, expected $#"
            exit 1
          fi
        env:
          VANR_TEST_POSTGRES_URL: postgres://postgres@localhost:5432/vanr_test
          VANR_TEST_DROP_LOCKS: "1"
      # Every answer of a round kept once and an answer that meets the stop finds the queue closed (the debate's row
      # lock); one routine execution per fire, scheduled time and queued run, with callers on several connections.
      - run: bun test apps/server/test/debates-postgres.test.ts
        env:
          VANR_TEST_POSTGRES_URL: postgres://postgres@localhost:5432/vanr_test
      - name: The forced debate lock tests fail without the locks
        run: |
          set +e
          bun test apps/server/test/debates-postgres.test.ts --test-name-pattern forced > forced-debates.log 2>&1
          status=$?
          cat forced-debates.log
          if [ "$status" -eq 0 ]; then
            echo "::error::the forced debate lock tests passed without the locks"
            exit 1
          fi
          for broken in LOCK_WAIT_TIMEOUT CONNECTION_CLOSED "Unhandled error" "timed out"; do
            if grep -aqF "$broken" forced-debates.log; then
              echo "::error::the forced debate lock tests broke ($broken) instead of failing on their outcome"
              exit 1
            fi
          done
          set -- debate-answer debate-stop
          for label in "$@"; do
            if ! grep -aqF "LOCK_OUTCOME_MISMATCH($label)" forced-debates.log; then
              echo "::error::the forced $label test did not fail on its outcome without the lock"
              exit 1
            fi
          done
          # Every failure is a forced test, and as many distinct tests failed as there are labels (bun prints
          # each failure twice on the GitHub runner, so names are counted, not lines).
          failed=$(grep -a '^(fail) ' forced-debates.log | sed -E 's/^\(fail\) //; s/ \[[0-9.]+m?s\]$//' | sort -u)
          if printf '%s\n' "$failed" | grep -qv forced; then
            echo "::error::a test outside the forced ones failed without the locks: $failed"
            exit 1
          fi
          count=$(printf '%s\n' "$failed" | grep -c .)
          if [ "$count" -ne "$#" ]; then
            echo "::error::$count distinct forced tests failed without the locks, expected $#"
            exit 1
          fi
        env:
          VANR_TEST_POSTGRES_URL: postgres://postgres@localhost:5432/vanr_test
          VANR_TEST_DROP_LOCKS: "1"
      # One refresh exchange per expiring OAuth token, one step-up card per scope set and no secret written onto a
      # connection revoked during the OAuth callback, from two connections.
      - run: bun test apps/server/test/connectors-postgres.test.ts
        env:
          VANR_TEST_POSTGRES_URL: postgres://postgres@localhost:5432/vanr_test
      - name: The forced connection lock tests fail without the row lock
        run: |
          set +e
          bun test apps/server/test/connectors-postgres.test.ts --test-name-pattern forced > forced-connectors.log 2>&1
          status=$?
          cat forced-connectors.log
          if [ "$status" -eq 0 ]; then
            echo "::error::the forced connection lock tests passed without the row lock"
            exit 1
          fi
          for broken in LOCK_WAIT_TIMEOUT CONNECTION_CLOSED "Unhandled error" "timed out"; do
            if grep -qF "$broken" forced-connectors.log; then
              echo "::error::the forced connection lock tests broke ($broken) instead of failing on their outcome"
              exit 1
            fi
          done
          labels="refresh step-up revoke"
          for label in $labels; do
            if ! grep -qF "LOCK_OUTCOME_MISMATCH($label)" forced-connectors.log; then
              echo "::error::the forced $label test did not fail on its outcome without the lock"
              exit 1
            fi
          done
          # Only the forced tests may fail, one per label: count distinct test names (bun prints each failure
          # twice on the runner), and every failed test must be a forced one.
          failed=$(grep -aE '^\(fail\) ' forced-connectors.log | sed -E 's/ \[[0-9.]+m?s\]$//' | sort -u)
          if grep -v 'forced' <<< "$failed" | grep -q .; then
            echo "::error::a test that is not a forced lock test failed without the lock"
            exit 1
          fi
          if [ "$(grep -c . <<< "$failed")" -ne "$(wc -w <<< "$labels")" ]; then
            echo "::error::expected one failed test per label, got: $failed"
            exit 1
          fi
        env:
          VANR_TEST_POSTGRES_URL: postgres://postgres@localhost:5432/vanr_test
          VANR_TEST_DROP_LOCKS: "1"
      # The server's search with the vector leg the boot turns on (ensureVector) and the embedding tick.
      - run: bun test apps/server/test/search-postgres.test.ts --test-name-pattern "on Postgres"
        env:
          VANR_TEST_POSTGRES_URL: postgres://postgres@localhost:5432/vanr_test
      # A Drive write and a storage destination change from two connections: the change waits for the
      # write's row lock and is rejected. The second run takes the locks out (a double in the test) and must
      # fail, so the first one can't pass without them.
      - run: bun test apps/server/test/storage-postgres.test.ts --test-name-pattern "on Postgres"
        env:
          VANR_TEST_POSTGRES_URL: postgres://postgres@localhost:5432/vanr_test
      - name: The storage race test fails without the row locks
        run: |
          if out=$(bun test apps/server/test/storage-postgres.test.ts --test-name-pattern "on Postgres" 2>&1); then
            echo "$out"
            echo "::error::the storage race test passed without the row locks"
            exit 1
          fi
          echo "$out"
          # It must fail for the race (the change was accepted), not for anything else.
          grep -q 'Received: "accepted"' <<< "$out"
        env:
          VANR_TEST_POSTGRES_URL: postgres://postgres@localhost:5432/vanr_test
          VANR_TEST_STORAGE_UNLOCKED: "1"
      # The bases' locks and the query against the oracle on Postgres (one database for the file).
      - run: bun test apps/server/test/bases-postgres.test.ts --test-name-pattern "on Postgres"
        env:
          VANR_TEST_POSTGRES_URL: postgres://postgres@localhost:5432/vanr_test
      # The same forced interleavings with the one lock order of the bases swapped for a double in the test
      # (VANR_TEST_BASES_LOCKS): each write locks only its own database, and the two deletes must FAIL for the
      # deadlock (one side answers base.busy); with no database lock at all, the three view writes must FAIL
      # for the race (the cap passed, the last view taken, one place shared). Nothing else counts.
      - name: The bases lock tests fail without the one order and without the view locks
        run: |
          set +e
          own=$(VANR_TEST_BASES_LOCKS=own bun test apps/server/test/bases-postgres.test.ts --test-name-pattern "forced interleaving: deleting" 2>&1)
          own_status=$?
          none=$(VANR_TEST_BASES_LOCKS=none bun test apps/server/test/bases-postgres.test.ts --test-name-pattern "forced interleaving: views" 2>&1)
          none_status=$?
          set -e
          echo "$own"
          echo "$none"
          if [ "$own_status" -eq 0 ] || [ "$none_status" -eq 0 ]; then
            echo "::error::a bases lock test passed with its lock turned off"
            exit 1
          fi
          # On a GitHub runner bun prints each failure twice (the plain line and the annotation), so the
          # line is only looked for; " 2 fail" below is what says both tests failed.
          grep -q 'Expected to not contain: "base.busy"' <<< "$own"
          grep -q ' 2 fail' <<< "$own"
          grep -q 'Expected: "base.too_many_views"' <<< "$none"
          grep -q 'Expected: "base.last_view"' <<< "$none"
          grep -q 'Expected: 4' <<< "$none"
          grep -q ' 3 fail' <<< "$none"
        env:
          VANR_TEST_POSTGRES_URL: postgres://postgres@localhost:5432/vanr_test
      # Relation and rollup on Postgres: the propagation between linked sources never waits for a lock.
      - run: bun test apps/server/test/bases-relations-postgres.test.ts --test-name-pattern "on Postgres"
        env:
          VANR_TEST_POSTGRES_URL: postgres://postgres@localhost:5432/vanr_test
      # The forced interleavings of the relations with one of the propagation's locks swapped for a double
      # (VANR_TEST_BASES_LINKS): `late` takes the dependent rows before their source, `wait` waits for a held
      # dependent row. Each run must FAIL, and only for its own interleaving: every "(fail)" line names that
      # test, one distinct test fails, and the failure is the wait it proves (`Expected: false`).
      - name: The bases links tests fail with the rows locked before the source and with a waiting row lock
        run: |
          check() {
            mode="$1"; label="$2"
            set +e
            out=$(VANR_TEST_BASES_LINKS="$mode" bun test apps/server/test/bases-relations-postgres.test.ts --test-name-pattern "forced interleaving: links" 2>&1)
            status=$?
            set -e
            echo "$out"
            if [ "$status" -eq 0 ]; then
              echo "::error::the bases links tests passed with VANR_TEST_BASES_LINKS=$mode"
              exit 1
            fi
            fails=$(grep -a '^(fail)' <<< "$out" | sed 's/ \[[0-9.]*m\?s\]$//' | sort -u)
            if [ -z "$fails" ] || grep -av "forced interleaving: links: $label" <<< "$fails" | grep -aq .; then
              echo "::error::VANR_TEST_BASES_LINKS=$mode failed a test other than \"$label\": $fails"
              exit 1
            fi
            if [ "$(wc -l <<< "$fails")" -ne 1 ]; then
              echo "::error::VANR_TEST_BASES_LINKS=$mode: expected one failing test, got: $fails"
              exit 1
            fi
            grep -aq 'Expected: false' <<< "$out"
          }
          check late "a source another write holds"
          check wait "a dependent row another transaction holds"
        env:
          VANR_TEST_POSTGRES_URL: postgres://postgres@localhost:5432/vanr_test
      # The identity check of the functions a connected database's query may call, each case in a database of its own.
      - run: bun test apps/server/test/sql-guard-identity.test.ts --test-name-pattern Postgres
        env:
          VANR_TEST_POSTGRES_URL: postgres://postgres@localhost:5432/vanr_test
      # The wiki on a real Postgres: saves on the same parent version; a member's save, move or trash that
      # comes while a lock holds the page waits for the page's row lock and is rejected; two saves that link
      # to each other both commit. The next two runs swap the row lock in the test (no lock, then the old FOR
      # UPDATE) and must fail by the result, so the first run can't pass without the lock it has. The
      # attachment test (in the first run too) is run again without the membership lock and must fail.
      - run: bun test apps/server/test/wiki.test.ts --test-name-pattern "on Postgres"
        env:
          VANR_TEST_POSTGRES_URL: postgres://postgres@localhost:5432/vanr_test
      - name: The wiki lock race test fails without the row lock
        run: |
          if out=$(bun test apps/server/test/wiki.test.ts --test-name-pattern "on Postgres" 2>&1); then
            echo "$out"
            echo "::error::the wiki lock race test passed without the row lock"
            exit 1
          fi
          echo "$out"
          # It must fail for the race (each member write was accepted), not for anything else.
          grep -q '"save 200"' <<< "$out"
          grep -q '"move 200"' <<< "$out"
          grep -q '"trash 200"' <<< "$out"
        env:
          VANR_TEST_POSTGRES_URL: postgres://postgres@localhost:5432/vanr_test
          VANR_TEST_WIKI_UNLOCKED: "1"
      - name: The wiki links test deadlocks with the old FOR UPDATE row lock
        run: |
          if out=$(bun test apps/server/test/wiki.test.ts --test-name-pattern "on Postgres" 2>&1); then
            echo "$out"
            echo "::error::the linked saves test passed with FOR UPDATE"
            exit 1
          fi
          echo "$out"
          # It must fail for the deadlock (one save answered wiki.busy), not for a deadline.
          grep -q '"409 wiki.busy"' <<< "$out"
        env:
          VANR_TEST_POSTGRES_URL: postgres://postgres@localhost:5432/vanr_test
          VANR_TEST_WIKI_FOR_UPDATE: "1"
      - name: The wiki attachment test lets a removal through without the membership lock
        run: |
          if out=$(bun test apps/server/test/wiki.test.ts --test-name-pattern "wiki attachments on Postgres" 2>&1); then
            echo "$out"
            echo "::error::the wiki attachment test passed without the membership lock"
            exit 1
          fi
          echo "$out"
          # It must fail for the race (the removal committed before the attachment), not for anything else.
          grep -q '"the removal ended before the attachment"' <<< "$out"
        env:
          VANR_TEST_POSTGRES_URL: postgres://postgres@localhost:5432/vanr_test
          VANR_TEST_WIKI_MEMBER_UNLOCKED: "1"

  sandbox:
    # The runner's real sandbox (bubblewrap + socat): the attack tests of the isolation of the agent's
    # processes. They skip where bubblewrap or socat is missing, so this job installs both and fails on a skip.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # What @anthropic-ai/sandbox-runtime checks on Linux (ripgrep, bubblewrap, socat), plus git and curl,
      # which the attack tests use.
      - name: Install the sandbox dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap socat ripgrep git curl
      - name: Allow unprivileged user namespaces
        # Ubuntu 23.10+ restricts them through AppArmor and bubblewrap cannot start without them.
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - run: bun test apps/runner/src/sandbox.test.ts apps/runner/src/cli-state.test.ts apps/runner/src/net-mode.test.ts --reporter=junit --reporter-outfile=sandbox-junit.xml
        env:
          # Makes the test fail if any real srt test would be skipped.
          VANR_SANDBOX_REQUIRED: "1"
      - name: No test skipped
        run: |
          if grep -q "<skipped" sandbox-junit.xml; then
            grep -B1 "<skipped" sandbox-junit.xml
            echo "::error::a sandbox test was skipped"
            exit 1
          fi

  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
      ZIZMOR_VERSION: 1.31.1
      ZIZMOR_SHA256: d185f726bdaf92df78273217dfdd24ebcd6b0ef48cf3ce776ff5762b6e138c99
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint and zizmor
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          cd "$RUNNER_TEMP"
          curl -fsSL -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz -C bin actionlint
          curl -fsSL -o zizmor.tar.gz \
            "https://github.com/zizmorcore/zizmor/releases/download/v${ZIZMOR_VERSION}/zizmor-x86_64-unknown-linux-gnu.tar.gz"
          echo "${ZIZMOR_SHA256}  zizmor.tar.gz" | sha256sum -c -
          tar -xzf zizmor.tar.gz -C bin zizmor
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: actionlint
      - run: zizmor --format=github .github
        env:
          GH_TOKEN: ${{ github.token }}

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          cd "$RUNNER_TEMP"
          curl -fsSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz -C bin gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      # On a PR, scan the commits the PR adds; on main, scan the whole history.
      # --diff-merges=first-parent makes git log show what each merge commit
      # changes, which it hides by default, so a secret added in a merge is found.
      - run: |
          if [ "$EVENT" = pull_request ]; then
            # An unknown SHA makes git log fail and gitleaks scan nothing yet exit 0.
            for sha in "$BASE_SHA" "$HEAD_SHA"; do
              if ! git rev-parse --verify --quiet "${sha}^{commit}" > /dev/null; then
                echo "::error::commit not found: '${sha}'"
                exit 1
              fi
            done
            gitleaks git --no-banner --redact --log-opts="--diff-merges=first-parent $BASE_SHA..$HEAD_SHA" .
          else
            gitleaks git --no-banner --redact --log-opts="--diff-merges=first-parent --full-history --all --diff-filter=tuxdb" .
          fi
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

  ci-ok:
    if: always()
    needs: [lint, typecheck, test, web, postgres, sandbox, workflows, secrets]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: bun scripts/ci/gate.ts lint typecheck test web postgres sandbox workflows secrets
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
